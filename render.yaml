services:
  - type: web
    name: vokabeltrainer
    region: frankfurt
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER
        value: true
      - key: AUTH_SECRET
        generateValue: true
      - key: NOTIFICATION_API_TOKEN
        generateValue: true
